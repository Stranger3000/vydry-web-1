name: Deploy na hosting

on:
  push:
    branches: [main]
  workflow_dispatch: # umožní spustit nasazení i ručně tlačítkem v záložce Actions

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout obsah repozitáře
        uses: actions/checkout@v4

      - name: Nahrát web přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp          # pokud hosting umí FTPS, změň na: ftps
          local-dir: ./site/     # složka v repozitáři s hotovým webem
          server-dir: /www/      # cílová složka na hostingu
          exclude: |
            **/.git*
            **/.git*/**
            README.md
